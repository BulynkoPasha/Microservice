apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: DB_HOST
              value: "postgres-order"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDER_DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservice
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083