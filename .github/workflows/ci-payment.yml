name: Payment Service CI Pipeline

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'payment-service/**'

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: payment-service/pom.xml

      - name: Compile project
        run: mvn -B clean compile

  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: payment-service/pom.xml

      - name: Run unit and integration tests
        run: mvn -B test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-test-results
          path: payment-service/target/surefire-reports/

  docker-artifact:
    name: Artifact Creation (Docker image)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-payment-service" >> "$GITHUB_OUTPUT"

      - name: Build and run application via Docker Compose
        run: docker compose up -d --build

      - name: Wait for application to be healthy
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8084/actuator/health; do sleep 5; done'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop and remove containers
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./payment-service
          file: ./payment-service/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest