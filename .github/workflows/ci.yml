name: CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn -B clean compile

  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  code-analysis:
    name: Code Analysis (SonarQube)
    runs-on: ubuntu-latest
    needs: test
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/api/system/status || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for SonarQube to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:9000/api/system/status | grep -q "\"status\":\"UP\""; do sleep 5; done'

      - name: Generate SonarQube token
        id: sonar-token
        env:
          SONAR_ADMIN_USER: ${{ secrets.SONAR_ADMIN_USER }}
          SONAR_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}
        run: |
          TOKEN=$(curl -s -u "$SONAR_ADMIN_USER:$SONAR_ADMIN_PASSWORD" -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci-token" \
            | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run SonarQube analysis
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=user-service \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${{ steps.sonar-token.outputs.token }}

  docker-artifact:
    name: Artifact Creation (Docker image)
    runs-on: ubuntu-latest
    needs: code-analysis
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and run application via Docker Compose
        run: docker compose up -d --build

      - name: Wait for application to be healthy
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8081/api/v1/users; do sleep 5; done'

      - name: Show running containers
        run: docker compose ps

      - name: Stop and remove containers
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest