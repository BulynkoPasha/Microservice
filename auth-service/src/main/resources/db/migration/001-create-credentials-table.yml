databaseChangeLog:
  - changeSet:
      id: create-credentials
      author: Pavel Bulynko
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: login
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: create-credentials-login-index
      author: Pavel Bulynko
      changes:
        - createIndex:
            indexName: idx_credentials_login
            tableName: credentials
            unique: true
            columns:
              - column:
                  name: login

  - changeSet:
      id: create-credentials-user-id-index
      author: Pavel Bulynko
      changes:
        - createIndex:
            indexName: idx_credentials_user_id
            tableName: credentials
            unique: true
            columns:
              - column:
                  name: user_id